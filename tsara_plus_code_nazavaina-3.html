<!--
  TOROLALANA HO AN’NY MPANDEHA AMIN’NY KAODY (Débutant)
  -----------------------------------------------------
  Ity dia application web tokana: HTML + CSS + JavaScript.
  - HTML: rafitra sy singa hita eo amin’ny pejy.
  - CSS: loko, haben’ny singa, toerana ary endrika rehefa amin’ny finday.
  - JavaScript: fitetezana pejy, kajy, fitahirizana angona, import/export ary PDF.
  - localStorage: fitahirizana angona ao amin’ilay navigateur/telefaonina.
  Ny commentaires dia fanazavana ho an’ny mpianatra; natao tsy hanova ny fiasan’ny app.
-->
<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173f5f">
<title>Tatitra momban'ny fanompoana - Fiangonana Tanambe Ambodiadabo</title>
<style>
/* Loko sy masontsivana iombonana: ovaina eto raha te hanova ny endrika ankapobeny. */
:root{
  --primary:#126b45; --primary2:#198754; --accent:#b8d98a; --bg:#f3f8f5;
  --card:#fff; --text:#17212b; --muted:#6d7883; --line:#dce3e9;
  --green:#168653; --danger:#c94b4b; --shadow:0 10px 28px rgba(20,45,65,.09);
  --radius:16px;
}
/* Fitsipika fototra: mitovy kajy ny sakany sy ny haavon’ny singa. */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
/* Lohateny ambony sy bokotra menu. */
.topbar{height:64px;background:linear-gradient(135deg,#0b5d3b,#198754);color:white;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.icon-btn{border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:12px;font-size:21px}
.brand{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10px;font-weight:500;opacity:.78;margin-top:1px}
/* Sakany sy elanelan’ny votoatin’ny pejy. */
.container{max-width:1100px;margin:auto;padding:22px 16px 50px}
.hero{background:linear-gradient(135deg,#ffffff,#edf8f1);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:26px;color:var(--primary)}
.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.group-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:.18s;position:relative;overflow:hidden}
.group-card:hover{transform:translateY(-2px)}
.group-card .bar{position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}
.group-card h3{margin:4px 0 6px;font-size:20px;color:var(--primary)}
.group-card p{margin:0 0 16px;color:var(--muted);font-size:13px}
/* Endriky ny bokotra sy ny loko arakaraka ny asany. */
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#e9f0f5;color:var(--primary)}
.btn-gold{background:var(--accent);color:#17212b}
.btn-danger{background:#fdecec;color:var(--danger)}
.btn-green{background:#e7f6ee;color:var(--green)}
.btn:active{transform:scale(.98)}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0;color:var(--primary);font-size:25px}
.page-head p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* Karatra sy lisitry ny volana. */
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
.month-card h3{margin:0;color:var(--primary)}
.month-card span{font-size:12px;color:var(--muted)}
.section{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.section-head{padding:16px 18px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.section-head h2{margin:0;font-size:18px;color:var(--primary)}
.table-wrap{overflow:auto}
/* Tabilao sy saha fampidirana angona. */
table{width:100%;border-collapse:collapse;min-width:570px}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{background:#f8fafc;color:var(--primary);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
input[type=text],input[type=number],select{width:100%;border:1px solid #cfd8df;border-radius:9px;padding:8px 9px;background:#fff;outline:none}
.teaching-input{width:58px!important;max-width:58px!important;text-align:center;padding:7px 4px!important}
.number-input{width:72px!important;max-width:72px!important;text-align:center;padding:7px 4px!important}
input:focus,select:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(36,91,130,.10)}
.check{width:22px;height:22px;accent-color:var(--green)}
.total-row td{font-weight:800;background:#f7fbf9;color:#185b3d}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;background:#eaf1f6;color:var(--primary);font-size:11px;font-weight:800}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* Menu ilany sy lamba maizina miseho ao ambadika. */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:80}
.sidebar{position:fixed;top:0;bottom:0;left:-310px;width:290px;background:#fff;z-index:90;box-shadow:8px 0 30px rgba(0,0,0,.16);transition:left .22s;padding:18px;overflow:auto}
.sidebar.open{left:0}.sidebar-backdrop.open{display:block}
.side-title{font-weight:900;color:var(--primary);font-size:18px;padding:6px 8px 18px}
.side-btn{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;color:var(--text);font-weight:700;margin-bottom:3px}
.side-btn:hover{background:#eef4f8}
.side-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:18px 8px 7px}
.saved-item{display:flex;align-items:center;justify-content:space-between;gap:6px}
.saved-item button{flex:1}
/* Modal: varavarankely miseho eo ambonin’ny pejy. */
.modal-backdrop{position:fixed;inset:0;background:rgba(12,25,35,.48);z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:18px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.modal-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;color:var(--primary)}
.modal-body{padding:18px}.modal-actions{padding:0 18px 18px;display:flex;justify-content:flex-end;gap:8px}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 15px}
.radio{border:1px solid var(--line);padding:10px 12px;border-radius:10px;display:flex;gap:7px;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#17212b;color:white;padding:12px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200;font-weight:700;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Karatra famintinana sy totalin’ny tatitra. */
.total-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:12px;font-weight:800}.stat .num{font-size:29px;font-weight:900;color:var(--primary);margin-top:6px}
.note{background:#fff8e8;border:1px solid #f1dfae;color:#6d5420;border-radius:12px;padding:11px 13px;font-size:13px;margin:14px 0}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}

/* Endrika fanampiny ho an’ny singa manokana ao amin’ny app. */
.home-groups .group-card{cursor:pointer;text-align:center;padding:24px 14px}.total-link{margin-top:18px}.total-button{width:100%;border:0;background:transparent;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--primary);cursor:pointer}.saved-month{border-color:var(--green);background:#f7fcf9}.month-card{cursor:pointer;min-height:62px}.month-card h3{font-size:18px}.report-head{align-items:center}.report-head h1{margin:8px 0 0}.person-row{display:grid;grid-template-columns:minmax(0,1fr) 32px 62px 116px;gap:8px;align-items:start;padding:15px 8px;border-bottom:1px solid var(--line)}.person-main{min-width:0}.person-name{font-weight:800;padding:2px 0 9px}.note-input{width:100%;border:1px solid #dce3e9;border-radius:8px;padding:7px;font-size:12px}.hours-input{width:62px;padding:7px}.stepper{display:flex;align-items:center;gap:4px}.stepper button{width:31px;height:31px;border:1px solid var(--line);border-radius:8px;background:#f4f7fa;font-weight:900;font-size:18px}.stepper span{min-width:20px;text-align:center;font-weight:800}.category-title,.total-section-title{font-size:18px;font-weight:900;color:var(--primary);padding:15px 4px 8px}.category-title .badge{float:right}.people-list{background:#fff}.total-line{display:flex;justify-content:space-between;padding:11px 14px;background:#f7fbf9}.section-note{padding:10px 4px;display:flex;gap:7px;flex-wrap:wrap}.total-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:0 0 18px;box-shadow:var(--shadow)}.total-card strong{font-size:28px;display:block;color:var(--primary);margin:3px 0 8px}.total-card div{margin:6px 0}.export-item{padding:10px 4px;border-bottom:1px solid var(--line)}.export-name{font-size:12px;font-weight:800;word-break:break-word}.export-actions{display:flex;gap:6px;margin-top:6px}.mini-btn{border:0;border-radius:7px;padding:6px 8px;background:#e9f0f5;color:var(--primary);font-size:11px;font-weight:700}.mini-btn.danger{background:#fdecec;color:var(--danger)}
/* Fanitsiana endrika ho an’ny efijery kely, indrindra ny finday. */
@media(max-width:650px){
 .container{padding:12px 7px 32px}.hero{padding:16px;border-radius:16px}.hero h1{font-size:20px}
 .topbar{height:58px;padding:0 8px}.brand{font-size:13px}.brand small{font-size:8px}
 .actions{width:100%}.actions .btn{padding:8px 9px;font-size:11px}
 .page-head{margin-bottom:12px}.page-head h1{font-size:21px}
 .section{border-radius:14px;margin:10px 0}.section-head{padding:12px}
 th,td{font-size:12px;padding:7px 5px}
 table{min-width:430px}.group-card{padding:13px}.month-grid{grid-template-columns:1fr 1fr;gap:8px}
 .month-card{padding:11px;border-radius:12px;display:block}.month-card h3{font-size:16px}.month-card .btn{margin-top:8px;width:100%;padding:8px}
 .total-cards{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat .num{font-size:23px}
 .note{font-size:11px;padding:9px}
}

.person-note-wrap{margin-top:7px}.note-toggle{border:0;background:transparent;color:var(--primary2);font-size:12px;font-weight:800;padding:2px 0}.note-input{font-size:15px!important;min-height:46px;resize:vertical}.hours-input{font-size:20px!important;font-weight:900!important;width:78px!important}.report-head .save-state{font-size:12px;color:var(--green);font-weight:800;opacity:0}.report-head .save-state.show{opacity:1}.category-title{font-size:19px;font-weight:900;color:var(--primary);padding:15px 4px 8px}.manage-row{margin-top:10px}.export-folder{font-size:12px;font-weight:800;padding:8px 4px;border-bottom:1px solid var(--line)}

/* ===== S-21 : formulaire + PDF S-21-MG ===== */
.s21-list{display:flex;flex-direction:column;gap:8px}
.s21-person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.s21-person-name{font-weight:800;color:var(--text);min-width:0;word-break:break-word}
.s21-search{margin-bottom:14px}.s21-search input{font-size:15px;padding:11px 12px}
.s21-form-wrap{background:transparent;padding:0;overflow:visible}
.s21-screen-form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.s21-form-title{font-size:20px;font-weight:900;color:var(--primary);margin-bottom:4px}
.s21-form-subtitle{font-size:12px;color:var(--muted);margin-bottom:16px}
.s21-form-section{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.s21-form-section h3{font-size:14px;margin:0 0 12px;color:var(--primary)}
.s21-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.s21-field-label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#334155}
.s21-field-label input[type=text],.s21-field-label input[type=date],.s21-field-label input[type=number]{width:100%;box-sizing:border-box;border:1px solid #cfd8df;border-radius:9px;padding:10px 11px;background:#fff;color:#111;font-size:15px;outline:none}
.s21-field-label input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,104,76,.1)}
.s21-options{display:flex;flex-wrap:wrap;gap:8px}

.s21-option input{width:18px;height:18px;margin:0}
.s21-month-table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

.s21-month-table th,.s21-month-table td{border-bottom:1px solid #d7dee4;border-right:1px solid #d7dee4;padding:7px 6px;font-size:12px;text-align:center;vertical-align:middle}
.s21-month-table th{background:#f2f7f5;color:#173f5f;font-weight:900}
.s21-month-table th:last-child,.s21-month-table td:last-child{border-right:0}
.s21-month-table tr:last-child td{border-bottom:0}
.s21-month-table td:first-child{text-align:left;font-weight:800;white-space:nowrap}
.s21-month-table input[type=checkbox]{width:18px;height:18px;margin:0}
.s21-month-table input[type=number],.s21-month-table input[type=text]{width:100%;box-sizing:border-box;border:1px solid #d2dae0;border-radius:6px;padding:6px;text-align:center;font-size:13px;background:#fff}
.s21-month-table td:last-child input{text-align:left}
.s21-total-box{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:10px}
.s21-total-pill{min-width:130px;background:#f2f7f5;border:1px solid #d5e4dd;border-radius:10px;padding:9px 12px;text-align:center;font-size:12px;font-weight:800;color:#234}
.s21-total-pill strong{display:block;font-size:19px;color:var(--primary);margin-top:3px}
.s21-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.s21-help{font-size:12px;color:var(--muted);margin:6px 0 14px}

/* ===== DESIGN V2 ===== */
body{background:linear-gradient(180deg,#f8fafc 0,#edf3f7 100%)}

let currentYear=null;
let data=defaultData();
let current={page:"year",group:null,month:null};
let importTarget=null;
let manageSnapshot=null;
let manageDirty=false;

// Rehefa true dia azo ovaina tanana ny tabilao isam-bolana ao amin’ny S-21.
let s21ManualEdit=false;
// True rehefa misy fanovana mbola tsy notsindriana ny bokotra Tehirizo.
let s21Dirty=false;

// Mamorona famantarana ny pejy sy taona ankehitriny, mba hahafahana mamerina azy amin’ny Back.

function appHistoryKey(){
 return JSON.stringify({year:currentYear,current:current});
}
// Mitahiry ny toetry ny pejy ao amin’ny tantaran’ny navigateur.
function pushAppHistory(){
 if(historySyncing)return;
 const key=appHistoryKey();
 if(key===lastHistoryKey)return;
 history.pushState({app:"tatitra-fanompoana",year:currentYear,current:current},"",location.href.split("#")[0]);
 lastHistoryKey=key;
}
// Mamerina ny pejy sy taona araka ny tantara voatahiry.
function restoreAppHistory(state){
 historySyncing=true;
 try{
  const st=state||{};
  const y=st.year||null;
  if(y && y!==currentYear){
   currentYear=y;
   data=getYearData(y);ensureDefaults(data);s21Data=getYearS21(y);
  }else if(!y){
   currentYear=null;
  }
  current=st.current||{page:currentYear?"home":"year",group:null,month:null};
  lastHistoryKey=appHistoryKey();
  render();
 }finally{historySyncing=false;}
}
// Mamaky ny lisitry ny taona sy ny angona voatahiry ao amin’ny localStorage.

function yearStore(){try{return JSON.parse(localStorage.getItem("tatitra_fanompoana_years_v4"))||{};}catch(e){return {};}}
// Mitahiry ny angona taona ao amin’ny localStorage.
function saveYearStore(x){localStorage.setItem("tatitra_fanompoana_years_v4",JSON.stringify(x));}
// Maka ny taona fanombohana amin’ny soratra toy ny “2026-2027”.
function yearStart(y){return Number(String(y).split("-")[0]);}
// Mamorona soratra maneho taom-panompoana roa taona.
function serviceYearLabel(y){return `${y} - ${y+1}`;}
// Maka ny taona efa misy angona voatahiry.
function availableYears(){
 const st=yearStore(),ys=Object.keys(st).filter(Boolean);
 if(!ys.length) ys.push("2026-2027");
 return [...new Set(ys)].sort((a,b)=>yearStart(b)-yearStart(a));
}
// Mamaritra ny taom-panompoana miseho amin’ny voalohany.
function defaultYears(){return ["2026-2027"]; }
// Maka ny tatitra mifandraika amin’ny taona voafidy.
function getYearData(y){
 const st=yearStore();
 if(st[y]?.data) return normalizeData(st[y].data);
 // Migration unique: les anciennes données existantes deviennent 2026-2027.
 if(y==="2026-2027"){try{const old=JSON.parse(localStorage.getItem("tatitra_fanompoana_v1"));if(old&&old.groups)return normalizeData(old);}catch(e){}}
 return defaultData();
}
// Maka ny angona S-21 mifandraika amin’ny taona voafidy.
function getYearS21(y){
 const st=yearStore();
 return st[y]?.s21||{};
}
// Mitahiry ny angona tatitra sy S-21 ho an’ny taona ankehitriny.
function persistCurrentYear(){
 if(!currentYear)return;
 const st=yearStore();
 st[currentYear]={version:4,serviceYear:currentYear,data:data,s21:s21Data};
 saveYearStore(st);
}
// Misafidy taom-panompoana iray ary manokatra ny pejy fandraisana. Fanamarihana: ekena ny elanelana manodidina ny tsipika mampisaraka taona.
function selectServiceYear(y){
 if(!/^\d{4}\s*-\s*\d{4}$/.test(y))return;
 currentYear=y;data=getYearData(y);ensureDefaults(data);s21Data=getYearS21(y);
 persistCurrentYear();
 current={page:"home",group:null,month:null};
 renderSaved();render();
}
// Miverina amin’ny pejy fisafidianana taona.
function openYearSelector(){current={page:"year",group:null,month:null};render();}
// Manampy taom-panompoana vaovao, nefa tsy manokatra azy avy hatrany.
function addServiceYear(){
 // Maka ny taona efa misy, mba hahafantarana hoe taona manaraka inona no hoforonina.
 const years=[...new Set([...defaultYears(),...availableYears()])];
 const starts=years.map(yearStart).filter(Number.isFinite);
 const next=Math.max(2025,...starts)+1;
 const label=serviceYearLabel(next);
 const st=yearStore();

 // Mamorona angona banga ho an'ilay taona raha mbola tsy misy.
 if(!st[label]){
   st[label]={version:4,serviceYear:label,data:defaultData(),s21:{}};
   saveYearStore(st);
 }

 // Mijanona eo amin'ny pejy fisafidianana taona.
 // Hiseho ao amin'ny lisitra ilay taona vaovao; ny mpampiasa no manindry azy
 // rehefa tena te hiditra sy hampiasa azy.
 current={page:"year",group:null,month:null};
 renderSaved();
 render();
 toast(`📁 ${label} noforonina`);
}
// Manala taona sy ny angona mifandray aminy rehefa voamarina.
function deleteServiceYear(y){
 const st=yearStore();
 if(!st[y])return;
 openModal("Hamafa dossier",`<div class="confirm-copy">Hofafana tanteraka ny dossier <b>${esc(y)}</b> sy ny tatitra/S-21 ao anatiny.</div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Ajanony</button>
   <button class="btn btn-danger" onclick="confirmDeleteServiceYear('${esc(y)}')">Eny, fafao</button>`);
}
// Asa (fonction) ampiasain’ny app. Jereo ny kaody ao anatiny hahitana ny antsipiriany.
function confirmDeleteServiceYear(y){
 const st=yearStore();
 delete st[y];
 saveYearStore(st);
 closeModal();
 if(currentYear===y){currentYear=null;data=defaultData();s21Data={};current={page:"year",group:null,month:null};}
 renderSaved();render();
 toast(`📁 ${y} voafafa`);
}
// Mamorona rafitra angona banga ho an’ny tatitra.


function defaultData(){
 const d={version:3,app:"Tatitra Fanompoana",groups:{}};
 GROUPS.forEach(g=>{
   const people=[...new Set(RAW_GROUPS[g]||[])];
   d.groups[g]={people:{
     publisher:people.filter(n=>!PERMANENT.includes(n)),
     assistant:[],
     pioneer:people.filter(n=>PERMANENT.includes(n))
   },months:{}};
   MONTHS.forEach(m=>d.groups[g].months[m]=newMonth());
 });
 return d;
}
// Mamorona rafitra angona banga ho an’ny volana iray.
function newMonth(){
 return {publisher:{},assistant:{},pioneer:{},saved:false,dirty:false};
}
// Maka ny angona mifanaraka amin’ny taona voafidy.
function loadData(){return currentYear?getYearData(currentYear):defaultData();}
// Manitsy ny endriky ny angona mba hifanaraka amin’ny rafitra andrasan’ny app.
function normalizeData(x){
 GROUPS.forEach(g=>{
   if(!x.groups[g]) x.groups[g]={people:{publisher:[],assistant:[],pioneer:[]},months:{}};
   const p=x.groups[g].people||{};
   x.groups[g].people={
     publisher:[...new Set(p.publisher||[])],
     assistant:[...new Set(p.assistant||[])],
     pioneer:[...new Set(p.pioneer||[])]
   };
   MONTHS.forEach(m=>{
     if(!x.groups[g].months[m]) x.groups[g].months[m]=newMonth();
     const md=x.groups[g].months[m];
     md.publisher=md.publisher||{};
     md.assistant=md.assistant||{};
     md.pioneer=md.pioneer||{};
     if(md.saved===undefined)md.saved=false;
     if(md.dirty===undefined)md.dirty=false;
     // Ny sokajy ao amin'ity volana ity no ampiasaina amin'ny Tatitra.
     // Raha mbola tsy nisy override, dia maka ny lisitra ankapoben'ny vondrona.
     if(!md.categories){
       md.categories={
         publisher:[...x.groups[g].people.publisher],
         assistant:[...x.groups[g].people.assistant],
         pioneer:[...x.groups[g].people.pioneer]
       };
     }
   });
 });
 ensureDefaults(x);
 x.version=3;
 return x;
}
// Manampy sanda fototra tsy ampy nefa ilain’ny app.
function ensureDefaults(x){
 // Group leaders are publishers.
 const leaders={Tojo:"Tojo",Ndremanga:"Ndremanga",Ndretiana:"Ndretiana",Samuel:"Samuel"};
 Object.entries(leaders).forEach(([g,n])=>{
   if(!x.groups[g].people.publisher.includes(n)){
     x.groups[g].people.publisher.unshift(n);
   }
   x.groups[g].people.assistant=x.groups[g].people.assistant.filter(v=>v!==n);
   x.groups[g].people.pioneer=x.groups[g].people.pioneer.filter(v=>v!==n);
 });
 // Rahery is a publisher by default in Tojo.
 if(!x.groups.Tojo.people.publisher.includes("Rahery"))
   x.groups.Tojo.people.publisher.splice(4,0,"Rahery");
 // Johary is permanent pioneer.
 if(!x.groups.Johary.people.pioneer.includes("Johary"))
   x.groups.Johary.people.pioneer.unshift("Johary");
 // Normalize old spelling.
 GROUPS.forEach(g=>{
   ["publisher","assistant","pioneer"].forEach(cat=>{
     x.groups[g].people[cat]=x.groups[g].people[cat].map(n=>
       n==="Maminarovana"||n==="Maminanarovana"?"Mamy Narovana":n
     );
     x.groups[g].people[cat]=[...new Set(x.groups[g].people[cat])];
   });
   MONTHS.forEach(m=>{
     const md=x.groups[g].months[m];
     ["publisher","assistant","pioneer"].forEach(cat=>{
       ["Maminarovana","Maminanarovana"].forEach(old=>{
         if(md[cat]&&md[cat][old]){
           md[cat]["Mamy Narovana"]=md[cat][old];
           delete md[cat][old];
         }
       });
     });
   });
 });
  // Migration des anciens noms vers ceux de la liste fournie.
  const renames={Tojo:{Tahina:"Tahiana Tojo",Mamitahina:"Mamy Tahiana"},Samuel:{Santratra:"Santatra",Francoise:"Françoise"},Johary:{Narovana:"Narovantsoa"}};
  Object.entries(renames).forEach(([g,map])=>{const pg=x.groups[g].people;Object.entries(map).forEach(([oldName,newName])=>{["publisher","assistant","pioneer"].forEach(cat=>{if(pg[cat]?.includes(oldName)){pg[cat]=pg[cat].filter(n=>n!==oldName);if(!pg[cat].includes(newName))pg[cat].push(newName);}MONTHS.forEach(m=>{const md=x.groups[g].months[m];if(md[cat]?.[oldName]){md[cat][newName]=md[cat][oldName];delete md[cat][oldName];}});});});});
}

// Maka ny angona S-21 ho an’ny taona ankehitriny.
function loadS21Data(){return currentYear?getYearS21(currentYear):{};}
// Mitahiry ny angona S-21.
function saveS21Data(){persistCurrentYear();}
// Mamorona S-21 banga ho an’ny olona iray.
function blankS21(){
 const months={};
 MONTHS.forEach(m=>months[m]={participated:false,teachings:"",aux:false,hours:"",note:""});
 return {name:"",birthDate:"",gender:"",baptismDate:"",hope:"",lahy:false,vavy:false,ondry:false,voahosotra:false,elder:false,minister:false,regularPioneer:false,specialPioneer:false,missionary:false,serviceYear:"",months};
}
// Manangona ny anaran’olona rehetra ampiasain’ny app.
function allPeople(){
 const map=new Map();
 Object.keys(PERSON_PROFILES).forEach(name=>map.set(name,{name,groups:[],cats:[]}));
 GROUPS.forEach(g=>{
   const p=data.groups[g].people||{};
   ["publisher","assistant","pioneer"].forEach(cat=>{
     (p[cat]||[]).forEach(name=>{
       if(!map.has(name))map.set(name,{name,groups:[],cats:[]});
       const x=map.get(name);
       if(!x.groups.includes(g))x.groups.push(g);
       if(!x.cats.includes(cat))x.cats.push(cat);
     });
   });
 });
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"mg",{sensitivity:"base"}));
}
// Maka kopian’ny mombamomba ny olona iray raha misy.
function profileForPerson(name){return PERSON_PROFILES[name]?Object.assign({},PERSON_PROFILES[name]):null;}
// Manamarina raha voasokajy ho mpisava lalana maharitra ilay olona.
function isCurrentPermanentPioneer(name){
  return GROUPS.some(g=>Array.isArray(data.groups[g]?.people?.pioneer) && data.groups[g].people.pioneer.includes(name));
}
// Mampifanaraka ny sata mpisava lalana maharitra amin’ny angona S-21.
function syncS21PermanentPioneer(name,isPermanent){
  const x=ensureS21Person(name);
  x.regularPioneer=!!isPermanent;
  saveS21Data();
}
// Maka na manomana ny angona S-21 an’ilay olona amin’ny volana iray.
function reportS21Month(name,month){
 // Raha nisy fanovana tanana tao amin’ny S-21, io no ampiasaina fa tsy ny kajy mandeha ho azy.
 const manual=s21Data[name]?.months?.[month];
 if(manual?.manualOverride){
   return {participated:!!manual.participated,teachings:manual.teachings??"",aux:!!manual.aux,hours:manual.hours??"",note:manual.note??"",manualOverride:true};
 }
 let out={participated:false,teachings:"",aux:false,hours:"",note:""};
 let isAssistantThisMonth=false;
 GROUPS.forEach(g=>{const md=data.groups[g]?.months?.[month];if(!md)return;["publisher","assistant","pioneer"].forEach(cat=>{const v=md[cat]?.[name];if(!v)return;const teaching=Number(v.teachings)||0,hours=Number(v.hours)||0;if(cat==="publisher")out.participated=out.participated||!!v.active;else out.participated=out.participated||false;if(cat==="assistant")isAssistantThisMonth=true;if(teaching>0)out.teachings=String(teaching);if(hours>0)out.hours=String(hours);if(cat==="assistant"&&(hours>0||teaching>0||v.active))out.aux=true;if(String(v.note||"").trim())out.note=String(v.note);});});
 // Tsy asiana ✓ amin’ny “Nandray anjara” raha mpisava lalana maharitra na mpanampy ilay olona.
 if(isCurrentPermanentPioneer(name)||isAssistantThisMonth)out.participated=false;
 return out;
}
// Miantoka fa misy firaketana S-21 ho an’ilay olona.
function ensureS21Person(name){

 else {if(typeof x.lahy!=="boolean"&&typeof x.vavy!=="boolean"){x.lahy=String(x.gender||"").toLowerCase()==="lahy";x.vavy=String(x.gender||"").toLowerCase()==="vavy";}if(typeof x.ondry!=="boolean"&&typeof x.voahosotra!=="boolean"){x.ondry=String(x.hope||"").toLowerCase()==="ondry";x.voahosotra=String(x.hope||"").toLowerCase()==="voahosotra";}}

// Maka ny sanda ao amin’ny formulaire S-21 ka mampiditra azy ao amin’ny angona.
function syncS21FormToData(){
  const form=document.querySelector('.s21-screen-form');
  const oldName=current.person;
  const x=ensureS21Person(oldName);
  if(!form)return {name:oldName,x};
  const labels=[...form.querySelectorAll('.s21-field-label')];
  const nameInput=labels[0]?.querySelector('input');
  const liveName=(nameInput?.value||oldName).trim()||oldName;
  if(liveName!==oldName){
    s21Data[liveName]=x;
    s21Data[liveName].name=liveName;
    delete s21Data[oldName];
    current.person=liveName;
  }
  const person=ensureS21Person(liveName);
  // Ny daty dia select 3 (andro/volana/taona), ka vakiana mivantana
  // avy amin'ireo selectors mba tsy ho very rehefa manamboatra PDF.
  person.birthDate=s21DatePartsFromSelectors('birth');
  person.baptismDate=s21DatePartsFromSelectors('baptism');
  person.name=liveName;
  // Vakiana amin'ny ID mazava ireo safidy 4, ka samy afaka ✓ tsy miankina.
  person.lahy=!!form.querySelector('#s21-lahy')?.checked;
  person.vavy=!!form.querySelector('#s21-vavy')?.checked;
  person.ondry=!!form.querySelector('#s21-ondry')?.checked;
  person.voahosotra=!!form.querySelector('#s21-voahosotra')?.checked;
  person.gender=person.vavy?'vavy':(person.lahy?'lahy':'');
  person.hope=person.voahosotra?'voahosotra':(person.ondry?'ondry':'');
  // Ny andraikitra rehetra dia checkbox misaraka tanteraka, toy ireo safidy 4.
  person.elder=!!form.querySelector('#s21-elder')?.checked;
  person.minister=!!form.querySelector('#s21-minister')?.checked;
  person.regularPioneer=!!form.querySelector('#s21-regularPioneer')?.checked;
  person.specialPioneer=!!form.querySelector('#s21-specialPioneer')?.checked;
  person.missionary=!!form.querySelector('#s21-missionary')?.checked;
  MONTHS.forEach(m=>{person.months[m]=reportS21Month(liveName,m);});
  saveS21Data();
  return {name:liveName,x:person};
}
// Manova angona sary ho bytes ilaina amin’ny PDF.
function s21PdfBytes(str){
  const out=[];
  for(let i=0;i<str.length;i++)out.push(str.charCodeAt(i)&255);
  return new Uint8Array(out);
}
// Manambatra ampahany maromaro ho tahiry bytes iray.
function s21ConcatBytes(parts){
  let total=0;parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let o=0;
  parts.forEach(p=>{out.set(p,o);o+=p.length;});
  return out;
}
// Mamorona PDF misy sary iray.
function s21MakeImagePdf(jpegDataUrl){
  const b64=jpegDataUrl.split(',')[1]||'';
  const bin=atob(b64);
  const img=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const objs=[];
  objs[1]=s21PdfBytes('<< /Type /Catalog /Pages 2 0 R >>');
  objs[2]=s21PdfBytes('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  objs[3]=s21PdfBytes('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  const imgHead=s21PdfBytes(`<< /Type /XObject /Subtype /Image /Width 1489 /Height 2105 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);
  const imgTail=s21PdfBytes('\nendstream');
  objs[4]=s21ConcatBytes([imgHead,img,imgTail]);
  const content=s21PdfBytes('q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n');
  objs[5]=s21ConcatBytes([s21PdfBytes(`<< /Length ${content.length} >>\nstream\n`),content,s21PdfBytes('endstream')]);
  const chunks=[s21PdfBytes('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n')];
  const offsets=[0];let pos=chunks[0].length;
  for(let i=1;i<=5;i++){
    offsets[i]=pos;
    const h=s21PdfBytes(`${i} 0 obj\n`),t=s21PdfBytes('\nendobj\n');
    chunks.push(h,objs[i],t);pos+=h.length+objs[i].length+t.length;
  }
  const xrefPos=pos;
  let xref=`xref\n0 6\n0000000000 65535 f \n`;
  for(let i=1;i<=5;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  xref+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
  chunks.push(s21PdfBytes(xref));
  return s21ConcatBytes(chunks);
}
// Manomana sy mamoaka ny PDF S-21.
function printS21PDF(){
  const synced=syncS21FormToData();
  const x=synced.x;
  const name=synced.name;
  const W=1489,H=2105;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,W,H);
    ctx.fillStyle='#111';
    ctx.textBaseline='top';
    ctx.font='27.5px Arial, Helvetica, sans-serif';
    ctx.fillText(String(name||''),W*0.14,H*0.0815);
    ctx.font='25px Arial, Helvetica, sans-serif';
    const birth=s21DateForInput(x.birthDate||'');
    const baptism=s21DateForInput(x.baptismDate||'');
    // Toerana mitovy amin'ny old.html ao amin'ny S-21 original.
    // Ny daty dia apetraka manomboka amin'ny 21% amin'ny sakany.
    ctx.textAlign='left';
    ctx.fillText(birth,W*0.21,H*0.1005);
    ctx.fillText(baptism,W*0.21,H*0.1182);
    const check=(cx,cy)=>{
      ctx.save();
      ctx.strokeStyle='#111';
      ctx.lineWidth=4.6;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(cx-7.5,cy);
      ctx.lineTo(cx-1.8,cy+6);
      ctx.lineTo(cx+8.5,cy-6.5);
      ctx.stroke();
      ctx.restore();
    };
    // Samy checkable tsy miankina ireo boaty 4.
    // Centres exacts des cases imprimées ao amin'ny modèle 1489x2105.
    if(x.lahy)check(972.5,224.5);
    if(x.vavy)check(1226.5,224.5);
    if(x.ondry)check(972.5,265.5);
    if(x.voahosotra)check(1226.5,265.5);
    if(x.elder)check(55,305);
    if(x.minister)check(310,305);
    if(x.regularPioneer)check(552,305);
    if(x.specialPioneer)check(853,305);
    if(x.missionary)check(1149,305);
    ctx.font='24px Arial, Helvetica, sans-serif';
    MONTHS.forEach((m,i)=>{
      const md=x.months[m]||{};
      const y=H*(0.24275+i*0.02354)+14;
      if(md.participated)check(342,y+1);
      if(md.aux)check(695,y+1);
      // Aforitra marina eo afovoan'ny cellule tsirairay ny chiffres.
      ctx.textAlign='center';
      ctx.fillText(String(md.teachings||''),W*(0.2881+0.1236/2),y);
      ctx.fillText(String(md.hours||''),W*(0.5252+0.1666/2),y);
      // Fanamarihana: afovoan'ny cellule manontolo, fa tsy eo amin'ny sisiny havia.
      // 69.17% = fiandohana, 27.74% = sakany, ka 83.04% = tena afovoany.
      if(String(md.note||'').trim())ctx.fillText(String(md.note),W*(0.6917+0.2774/2),y);
    });
    const hours=totalS21(name,'hours');
    ctx.font='27px Arial, Helvetica, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const totalY=(1095+1146)/2;
    // Ny "Tontaliny" ao amin'ny S-21 dia manana cellule roa: Ora eo ankavia,
    // Fanamarihana eo ankavanana. Apetraka ao afovoan'ilay cellule Ora ny total.
    const hoursX=(783+1034)/2;
    ctx.fillText(fmt(hours),hoursX,totalY);
    ctx.textAlign='left';
    ctx.textBaseline='top';
    const jpeg=canvas.toDataURL('image/jpeg',0.96);
    const pdf=s21MakeImagePdf(jpeg);
    const blob=new Blob([pdf],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`S-21-${String(name||'mpitory').replace(/[^a-zA-Z0-9À-ÿ _-]/g,'_')}.pdf`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };
  img.onerror=()=>alert('Tsy afaka namorona ilay PDF.');
  img.src=S21_TEMPLATE_DATA;
}

  if(!manageRedoStack.length){toast("Tsy misy fanovana azo averina indray");return;}
  manageUndoStack.push({data:JSON.parse(JSON.stringify(data)),s21:JSON.parse(JSON.stringify(s21Data))});
  const st=manageRedoStack.pop();
  data=JSON.parse(JSON.stringify(st.data));s21Data=JSON.parse(JSON.stringify(st.s21));
  manageDirty=true;saveData();saveS21Data();renderManage(document.getElementById("main"));toast("↷ Redo");
}
// Manokatra ny fitaovana fitantanana olona ao amin’ny vondrona iray.
function managePeople(g){
  manageUndoStack=[];manageRedoStack=[];
  manageSnapshot=JSON.parse(JSON.stringify(data));
  manageDirty=false;
  current={page:"manage",group:g,month:current.month};
  render();
}
// Manomana ny famerenana amin’ny laoniny ny lisitry ny olona rehetra.
function resetManageAll(){
  const g=current.group,m=current.month;
  if(!g||!m){toast("Tsy misy volana voafidy");return;}
  openModal("Hanafoana (Reset all)",`<div class="confirm-copy">
    Haverina amin'ny laoniny ny <b>lisitry ny sokajy rehetra</b> ao amin'ny <b>${esc(m)}</b> ao amin'ny taom-panompoana <b>${esc(currentYear)}</b> ihany.<br><br>
    Tsy hisy fiantraikany amin'ny volana na taom-panompoana hafa.
  </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Ajanony</button>
   <button class="btn btn-danger" onclick="confirmResetManageAll()">Eny, hanafoana</button>`);
}
// Manamarina ny famerenana amin’ny laoniny ny lisitry ny olona.
function confirmResetManageAll(){
  const g=current.group,m=current.month;
  pushManageHistory();
  const gd=data.groups[g], md=gd.months[m];
  const base=defaultData().groups[g];
  md.categories={
    publisher:[...base.people.publisher],
    assistant:[...base.people.assistant],
    pioneer:[...base.people.pioneer]
  };
  ["publisher","assistant","pioneer"].forEach(cat=>{md[cat]={};});
  closeModal();
  markManageDirty();
  toast(`${m}: Reset all vita`);
}
// Mampiseho ny pejy fitantanana olona.
function renderManage(main){
  const g=current.group,gd=data.groups[g],m=current.month;
  const section=(cat,label)=>`<section class="section">
    <div class="section-head"><h2>${label}</h2>
      <button class="btn btn-secondary" onclick="openAddPerson('${esc(g)}','${cat}')">＋ Hampiditra</button>
    </div>
    <div>${monthPeople(g,m,cat).map(n=>`<div class="manage-person">
      <div class="person-label">${esc(n)}</div>
      <div class="person-actions">
        <button class="mini-btn" onclick="movePersonPage('${esc(g)}','${esc(n)}','${cat}')">↔ Sokajy</button>
        <button class="mini-btn danger" onclick="deletePerson('${esc(g)}','${esc(n)}','${cat}')">🗑 Fafana</button>
      </div>
    </div>`).join("") || '<div class="manage-empty">Tsy misy olona ao amin’ity sokajy ity.</div>'}</div>
  </section>`;
  main.innerHTML=`<div class="page-head">
    <div><div class="page-actions">
      <button class="btn btn-secondary" onclick="leaveManage()">← Retour</button>
      <button class="icon-btn" title="Undo" onclick="undoManage()" aria-label="Undo">↶</button>
      <button class="icon-btn" title="Redo" onclick="redoManage()" aria-label="Redo">↷</button>
      <button class="btn btn-outline-danger" onclick="resetManageAll()">Hanafoana (Reset all)</button>
      ${manageDirty?'<span class="manage-dirty">● Fanovana mbola tsy voatahiry</span>':''}
    </div><h1 style="margin-top:10px">Hitantana sokajy</h1>
    <p>${esc(g)} — hampiditra, hamindra na hamafa olona.</p></div>
    <button class="btn btn-gold" onclick="finishManage()">Vita</button>
  </div>
  ${section("publisher","Mpitory")}
  ${section("assistant","Mpisavalalana mpanampy")}
  ${section("pioneer","Mpisavalalana maharitra")}`;
  requestAnimationFrame(()=>{
    main.scrollTop=0;
    main.parentElement && (main.parentElement.scrollTop=0);
    window.scrollTo(0,0);
  });
}
// Manamarika fa novaina ny lisitry ny olona.
function markManageDirty(){manageDirty=true;renderManage(document.getElementById("main"));}
// Mamarana ny fomba fitantanana olona.
function finishManage(){
  const g=current.group,m=current.month;
  if(manageDirty)saveData();
  manageSnapshot=null;manageDirty=false;
  current=m?{page:"report",group:g,month:m}:{page:"months",group:g,month:null};
  render();toast("Vita");
}
// Mitantana ny fivoahana rehefa misy fanovana mbola tsy voatahiry.
function leaveManage(){
  const g=current.group,m=current.month;
  if(!manageDirty){
    manageSnapshot=null;current=m?{page:"report",group:g,month:m}:{page:"months",group:g,month:null};render();return;
  }
  openModal("Fanovana sokajy",`<div class="confirm-copy">Nanova olona na sokajy ianao. Te-hitahiry ny fanovana ve?</div>`,
   `<button class="btn btn-secondary" onclick="discardManage()">Aza tehirizina</button>
    <button class="btn btn-danger" onclick="cancelLeaveManage()">Ajanony</button>
    <button class="btn btn-primary" onclick="saveAndLeaveManage()">Tehirizo</button>`);
}
// Manafoana ny fivoahana ary manidy ny modal.
function cancelLeaveManage(){closeModal();}
// Manary ireo fanovana fitantanana mbola tsy voatahiry.
function discardManage(){
  const g=current.group,m=current.month;
  if(manageSnapshot)data=JSON.parse(JSON.stringify(manageSnapshot));
  saveData();closeModal();manageSnapshot=null;manageDirty=false;
  current=m?{page:"report",group:g,month:m}:{page:"months",group:g,month:null};render();toast("Fanovana tsy voatahiry");
}
// Mitahiry ny fanovana fitantanana ary mivoaka.
function saveAndLeaveManage(){
  const g=current.group,m=current.month;
  saveData();closeModal();manageSnapshot=null;manageDirty=false;
  current=m?{page:"report",group:g,month:m}:{page:"months",group:g,month:null};render();toast("Fanovana voatahiry");
}
// Manomana famindrana olona ho amin’ny pejy na vondrona hafa.
function movePersonPage(g,name,from){
  const targets=from==="publisher"?["assistant","pioneer"]:from==="assistant"?["publisher","pioneer"]:["publisher","assistant"];
  openModal("Afindra sokajy",`<p><b>${esc(name)}</b></p><div class="radio-row">${
    targets.map((c,i)=>`<label class="radio"><input type="radio" name="move" value="${c}" ${i===0?"checked":""}> ${labelCat(c)}</label>`).join("")
  }</div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Ajanony</button>
   <button class="btn btn-primary" onclick="confirmMovePage('${esc(g)}','${esc(name)}','${esc(from)}')">Afindra</button>`);
}
// Manamarina sy manatanteraka ny famindrana olona.
function confirmMovePage(g,name,from){
  pushManageHistory();
  const el=document.querySelector('input[name="move"]:checked');if(!el)return;
  const to=el.value,gd=data.groups[g],m=current.month;
  if(!m){manageUndoStack.pop();toast("Safidio aloha ny volana");return;}
  const idx=MONTHS.indexOf(m);
  const md=gd.months[m];
  md.categories=md.categories||{publisher:[...gd.people.publisher],assistant:[...gd.people.assistant],pioneer:[...gd.people.pioneer]};
  ["publisher","assistant","pioneer"].forEach(c=>md.categories[c]=[...new Set(md.categories[c]||[])]);
  // Rehefa ovaina ho MPITORY dia MPITORY hatrany amin'ny volana manaraka rehetra ao anatin'ity taona ity.
  if(to==="publisher"){
    ["publisher","assistant","pioneer"].forEach(c=>{md.categories[c]=md.categories[c].filter(n=>n!==name);});
    md.categories.publisher.push(name);
    gd.people.publisher=gd.people.publisher.filter(n=>n!==name);gd.people.publisher.push(name);
    gd.people.assistant=gd.people.assistant.filter(n=>n!==name);gd.people.pioneer=gd.people.pioneer.filter(n=>n!==name);
    for(let i=idx+1;i<MONTHS.length;i++){
      const x=gd.months[MONTHS[i]];x.categories=x.categories||{publisher:[...gd.people.publisher],assistant:[...gd.people.assistant],pioneer:[...gd.people.pioneer]};
      ["publisher","assistant","pioneer"].forEach(c=>x.categories[c]=x.categories[c].filter(n=>n!==name));
      x.categories.publisher.push(name);
    }
    if(from==="pioneer")syncS21PermanentPioneer(name,false);
  } else if(to==="pioneer"){
    md.categories.publisher=md.categories.publisher.filter(n=>n!==name);md.categories.assistant=md.categories.assistant.filter(n=>n!==name);
    md.categories.pioneer=md.categories.pioneer.filter(n=>n!==name);md.categories.pioneer.push(name);
    gd.people.publisher=gd.people.publisher.filter(n=>n!==name);gd.people.assistant=gd.people.assistant.filter(n=>n!==name);
    if(!gd.people.pioneer.includes(name))gd.people.pioneer.push(name);
    for(let i=idx+1;i<MONTHS.length;i++){
      const x=gd.months[MONTHS[i]];x.categories=x.categories||{publisher:[...gd.people.publisher],assistant:[...gd.people.assistant],pioneer:[...gd.people.pioneer]};
      ["publisher","assistant"].forEach(c=>x.categories[c]=x.categories[c].filter(n=>n!==name));
      x.categories.pioneer=x.categories.pioneer.filter(n=>n!==name);x.categories.pioneer.push(name);
    }
    syncS21PermanentPioneer(name,true);
  } else {
    // Sokajy hafa: manomboka amin'ity volana ity, ary mitohy amin'ny volana manaraka.
    ["publisher","assistant","pioneer"].forEach(c=>md.categories[c]=md.categories[c].filter(n=>n!==name));
    md.categories[to].push(name);
    for(let i=idx+1;i<MONTHS.length;i++){
      const x=gd.months[MONTHS[i]];x.categories=x.categories||{publisher:[...gd.people.publisher],assistant:[...gd.people.assistant],pioneer:[...gd.people.pioneer]};
      ["publisher","assistant","pioneer"].forEach(c=>x.categories[c]=x.categories[c].filter(n=>n!==name));
      x.categories[to].push(name);
    }
    if(from==="pioneer")syncS21PermanentPioneer(name,false);
    if(!gd.people[to].includes(name))gd.people[to].push(name);
    ["publisher","assistant","pioneer"].filter(c=>c!==to).forEach(c=>gd.people[c]=gd.people[c].filter(n=>n!==name));
  }
  closeModal();markManageDirty();toast(`${labelCat(to)}: ${name} manomboka ${m} ary mitohy amin'ny volana manaraka`);
}
// Manomana famafana olona iray.
function deletePerson(g,name,cat){
  openModal("Hamafa olona",`<div class="confirm-copy">Hofafana ao amin'ny sokajy <b>${esc(labelCat(cat))}</b> i <b>${esc(name)}</b>?
  <br><br>Hoesorina amin'ity volana ity ny chiffre sy fanamarihana an'io olona io.</div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Ajanony</button>
   <button class="btn btn-danger" onclick="confirmDeletePerson('${esc(g)}','${esc(name)}','${esc(cat)}')">Fafana</button>`);
}
// Manamarina sy manatanteraka ny famafana olona.
function confirmDeletePerson(g,name,cat){
  pushManageHistory();
  const gd=data.groups[g],m=current.month;
  if(!m){manageUndoStack.pop();toast("Safidio aloha ny volana");return;}
  const md=gd.months[m];
  md.categories=md.categories||{publisher:[...gd.people.publisher],assistant:[...gd.people.assistant],pioneer:[...gd.people.pioneer]};
  md.categories[cat]=md.categories[cat].filter(n=>n!==name);
  if(md[cat])delete md[cat][name];
  if(cat==="pioneer"){
    // Esorina amin'ny lisitra ankehitriny ka miala koa ny ✓ ao amin'ny S-21.
    gd.people.pioneer=gd.people.pioneer.filter(n=>n!==name);
    syncS21PermanentPioneer(name,false);
  }
  closeModal();markManageDirty();toast("Olona voafafa amin'ity volana ity");
}
// Manangona ny angona amin’ny volana iray hoentina export.
function getMonthPayload(g,m){
 return {format:"TATITRA_FANOMPOANA_MONTH",version:4,serviceYear:currentYear,group:g,month:m,exportedAt:new Date().toISOString(),data:data.groups[g].months[m]};
}
// Mamaky ny lisitry ny rakitra export voatahiry.
function loadExports(){try{return JSON.parse(localStorage.getItem("tatitra_exports_v3"))||[]}catch(e){return[]}}
// Mitahiry ny lisitry ny rakitra export.
function saveExports(x){localStorage.setItem("tatitra_exports_v3",JSON.stringify(x.slice(0,50)));}
// Manomana rakitra JSON ho an’ny tatitra isam-bolana.

function exportMonth(g,m){
 const payload=getMonthPayload(g,m),text=JSON.stringify(payload,null,2);
 // A browser cannot physically create arbitrary Android folders with a download.
 // We preserve the requested hierarchy in the saved-export manager and filename.
 const filename=`Tatitra-${currentYear}-${g}-${m}.json`;
 const xs=loadExports();
 xs.unshift({id:Date.now(),name:filename,group:g,month:m,text,folder:`${g}/${m}`});
 saveExports(xs);
 const blob=new Blob([text],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),500);
 toast(`Export ${g} — ${m} vita`);
}
// Manokatra ny safidy hisafidianana rakitra JSON.
function openJsonFilePicker(g,m){
  importTarget={group:g,month:m};
  const f=document.getElementById("fileInput");
  if(!f){toast("Tsy hita ny sélection fichier");return;}
  f.accept=".json,application/json,text/json";
  f.value="";
  f.click();
}
// Manomboka ny fanafarana tatitra ho an’ny volana iray.

function triggerImportMonth(g,m){
 importTarget={group:g,month:m};
 const f=document.getElementById("fileInput");f.value="";f.click();
}
// Mamaky sy manamarina rakitra JSON ampidirina.
function handleImportFile(e){
 const file=e.target.files[0];e.target.value="";if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const p=JSON.parse(reader.result);
   if(p.format!=="TATITRA_FANOMPOANA_MONTH"||p.version!==4||!p.serviceYear||!p.group||!p.month||!p.data)throw new Error();
   if(!importTarget||p.serviceYear!==currentYear||p.group!==importTarget.group||p.month!==importTarget.month){
    toast(`Import refusé : ce fichier appartient à ${p.serviceYear||"une autre année"}`);return;
   }
   data.groups[p.group].months[p.month]=p.data;
   data.groups[p.group].months[p.month].dirty=false;
   saveData();current={page:"report",group:p.group,month:p.month};render();toast("Import vita");
  }catch(err){toast("Fichier tsy mety na tsy mifanaraka");}
  finally{importTarget=null;}
 };
 reader.readAsText(file);
}
// Mizara na mampidina ny rakitra export voafidy.
async function shareExport(id){
 const x=loadExports().find(v=>v.id===id);if(!x)return;
 const file=new File([x.text],x.name,{type:"application/json"});
 try{
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))
   await navigator.share({title:x.name,text:`Tatitra ${x.group} — ${x.month}`,files:[file]});
  else if(navigator.share)await navigator.share({title:x.name,text:x.text});
  else toast("Tsy misy partage system");
 }catch(e){}
}
// Mamafa rakitra export iray amin’ny lisitra.
function deleteExport(id){saveExports(loadExports().filter(x=>x.id!==id));renderSaved();toast("Fichier voafafa");}
// Mampiseho ireo rakitra export voatahiry ao amin’ny menu.
function renderSaved(){
 const el=document.getElementById("savedExports");if(!el)return;
 const xs=loadExports();
 el.innerHTML=xs.length?xs.map(x=>`<div class="export-item">
  <div class="export-folder">📁 ${esc(x.group)} / 📁 ${esc(x.month)}</div>
  <div class="export-name">📄 ${esc(x.name)}</div>
  <div class="export-actions"><button class="mini-btn" onclick="shareExport(${x.id})">Partage</button>
  <button class="mini-btn danger" onclick="deleteExport(${x.id})">Supprimer</button></div>
 </div>`).join(""):`<div class="empty">Tsy misy fichier exporté</div>`;
}
// Manambatra ny angona volana iray ho totaly.

function aggregate(month){
 const out={publisher:{count:0,teachings:0},assistant:{count:0,hours:0,teachings:0},pioneer:{count:0,hours:0,teachings:0}};
 const months=month?[month]:MONTHS;
 GROUPS.forEach(g=>months.forEach(m=>{
  const md=data.groups[g].months[m];
  ["publisher","assistant","pioneer"].forEach(cat=>{
   const list=monthPeople(g,m,cat);
   list.forEach(n=>{
    const v=md[cat][n]||{};
    const active=cat==="publisher"?!!v.active:(Number(v.hours)>0||Number(v.teachings)>0);
    if(active)out[cat].count++;
    out[cat].teachings+=Number(v.teachings)||0;
    if(cat!=="publisher")out[cat].hours+=Number(v.hours)||0;
   });
  });
 }));
 return out;
}
// Mampiseho ny pejin’ny totalin’ny tatitra.
function renderTotal(main){
 const m=current.month||MONTHS[0],a=aggregate(m);
 main.innerHTML=`<div class="page-head"><div><button class="btn btn-secondary" onclick="goHome()">←</button><h1>Total tatitra</h1></div></div>
 <div class="section" style="padding:14px;margin-bottom:18px"><label style="font-weight:800;color:var(--primary)">Volana</label><select onchange="changeTotalMonth(this.value)">${MONTHS.map(x=>`<option value="${esc(x)}" ${x===m?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
 <div class="total-section-title">• MPITORY — ${esc(m)}</div><div class="total-card"><div>Isan'ny tatitra</div><strong>${a.publisher.count}</strong><div>Fampianarana <b>${a.publisher.teachings}</b></div></div>
 <div class="total-section-title">• MPISAVALALANA MPANAMPY — ${esc(m)}</div><div class="total-card"><div>Isan'ny tatitra</div><strong>${a.assistant.count}</strong><div>Ora <b>${fmt(a.assistant.hours)}</b></div><div>Fampianarana <b>${a.assistant.teachings}</b></div></div>
 <div class="total-section-title">• MPISAVALALANA MAHARITRA — ${esc(m)}</div><div class="total-card"><div>Isan'ny tatitra</div><strong>${a.pioneer.count}</strong><div>Ora <b>${fmt(a.pioneer.hours)}</b></div><div>Fampianarana <b>${a.pioneer.teachings}</b></div></div>`;
}
// Manova ny volana aseho amin’ny pejy totaly.
function changeTotalMonth(m){current.month=m;renderTotal(document.getElementById('main'));}

// Tsy misokatra mivantana amin'ny tatitra intsony: taona aloha no safidiana.
currentYear=null;
data=defaultData();s21Data={};
// Android system Back / navigateur : miverina amin'ny écran teo aloha ao amin'ny app.
const initialHistoryState={app:"tatitra-fanompoana",year:currentYear,current:current};
history.replaceState(initialHistoryState,"",location.href.split("#")[0]);
lastHistoryKey=appHistoryKey();
window.addEventListener("popstate",function(e){restoreAppHistory(e.state);});
renderSaved();
render();
</script>
